<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Detalle del personaje | Rick and Morty</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" href="./css/styles.css" />
	</head>

	<body>
		<nav class="navbar navbar-dark bg-dark shadow-sm">
			<div class="container">
				<a class="navbar-brand fw-bold" href="./index.html">Rick and Morty</a>
			</div>
		</nav>

		<main class="container py-5">
			<a class="btn btn-outline-secondary mb-4" href="./index.html">&larr; Volver a personajes</a>

			<div id="character-loading" class="text-center py-5" role="status">
				<div class="spinner-border text-success" aria-hidden="true"></div>
				<p class="text-body-secondary mt-3 mb-0">Cargando personaje...</p>
			</div>

			<div id="character-error" class="alert alert-danger d-none" role="alert">
				No se pudo cargar el personaje solicitado.
			</div>

			<article id="character-detail" class="card shadow-sm d-none">
				<div class="row g-0">
					<div class="col-md-5 col-lg-4">
						<img id="character-image" class="img-fluid rounded-start w-100" src="" alt="" />
					</div>
					<div class="col-md-7 col-lg-8">
						<div class="card-body p-4 p-lg-5">
							<h1 id="character-name" class="card-title display-6 fw-bold mb-4"></h1>
							<dl class="row mb-0">
								<dt class="col-sm-4">Estado</dt>
								<dd id="character-status" class="col-sm-8"></dd>
								<dt class="col-sm-4">Especie</dt>
								<dd id="character-species" class="col-sm-8"></dd>
								<dt class="col-sm-4">Género</dt>
								<dd id="character-gender" class="col-sm-8"></dd>
								<dt class="col-sm-4">Origen</dt>
								<dd id="character-origin" class="col-sm-8"></dd>
							</dl>
						</div>
					</div>
				</div>
			</article>
		</main>

		<script type="module" src="./js/character.js"></script>
	</body>
</html>
