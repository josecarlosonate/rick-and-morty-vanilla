<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rick and Morty Characters</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <nav class="navbar navbar-dark bg-dark shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="./">Rick and Morty</a>
      </div>
    </nav>

    <main class="container py-5">
      <header class="text-center mb-5">
        <form id="search-form" class="mb-5 col-md-8 col-lg-6 mx-auto">
          <div class="input-group">
            <input
              id="search-input"
              type="search"
              class="form-control"
              placeholder="Buscar personaje por nombre..."
              aria-label="Buscar personaje por nombre"
            />
            <button class="btn btn-success" type="submit">Buscar</button>
          </div>
        </form>
        <button id="clear-search" class="btn btn-sm btn-outline-light d-none">
          Ver todos los personajes
        </button>
      </header>

      <section aria-labelledby="characters-title">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 id="characters-title" class="h3 mb-0">Personajes aleatorios</h2>
          <span id="characters-count" class="badge text-bg-success"
            >0 personajes</span
          >
        </div>

        <div id="characters-loading" class="text-center py-5" role="status">
          <div class="spinner-border text-success" aria-hidden="true"></div>
          <p class="text-body-secondary mt-3 mb-0">Cargando personajes...</p>
        </div>

        <div
          id="characters-error"
          class="alert alert-danger d-none"
          role="alert"
        >
          No se pudieron cargar los personajes. Inténtalo de nuevo.
        </div>

        <div
          id="characters-list"
          class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4"
        >
          <!-- Las tarjetas de personajes se insertarán aquí desde app.js. -->
        </div>
      </section>
    </main>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
